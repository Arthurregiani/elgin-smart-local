[package]
name = "elgin-smart-local"
version = "1.0.0"
edition = "2024"

[dependencies]
libcosmic = { git = "https://github.com/pop-os/libcosmic.git", rev = "5a8bd9482a35ae94c1e54edf77b331c6b970f170", default-features = false, features = ["winit", "tokio", "wayland", "x11", "a11y", "single-instance"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = 2
strip = true

[profile.dev]
debug = 0
